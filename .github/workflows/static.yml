name: Build and deploy Wonderlab to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install locked dependencies
        run: npm ci

      - name: Build for the Pages subfolder
        run: npm run build
        env:
          VITE_BASE_PATH: "${{ steps.pages.outputs.base_path }}/"
          # Optional teacher media uploads and short lesson links.
          # Set these in Settings > Secrets and variables > Actions > Variables.
          VITE_SUPABASE_URL: "${{ vars.SUPABASE_URL }}"
          VITE_SUPABASE_PUBLISHABLE_KEY: "${{ vars.SUPABASE_PUBLISHABLE_KEY }}"

      - name: Disable Jekyll processing
        run: touch site/.nojekyll

      - name: Upload built website only
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
